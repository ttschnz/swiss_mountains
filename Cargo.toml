[package]
name = "swiss_mountains_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "swiss_mountains"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.99"
csv = "1.3.1"
delaunator = "1.0.2"
env_logger = "0.11.8"
genanki-rs = {version = "0.4.0", git="https://github.com/ttschnz/genanki-rs"}
gif = "0.13.3"
image = "0.25.8"
kiddo = "5.2.2"
log = "0.4.28"
nalgebra = "0.33.2"
rayon = "1.11.0"
reqwest = { version = "0.12.23", features = [
    "blocking",
    "rustls-tls",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serial_test = "3.2.0"
showfile = "0.1.1"
three-d = { version = "0.18.2", features = ["headless"] }
three-d-asset = { version = "0.9.2", features = ["gif", "png"] }
tiff = "0.10.3"
tokio = { version = "1.47.1", features = ["full", "macros", "sync"] }
rusqlite = {version = "0.32.1", features = ["load_extension"]}
tokio-rusqlite = {version= "0.6.0", features = ["bundled"]}
yuv = "0.8.6"
zip = "4.6.0"
